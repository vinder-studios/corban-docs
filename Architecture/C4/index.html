<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SmartCorbans — C4 Model · Arquitetura de Software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <script>
  (function() {
    var saved = localStorage.getItem('smartcorbans-theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('smartcorbans-theme', next);
    updateThemeLabel();
  }
  function updateThemeLabel() {
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    var label = document.getElementById('themeLabel');
    if (label) label.textContent = current === 'dark' ? 'Escuro' : 'Claro';
  }
  document.addEventListener('DOMContentLoaded', updateThemeLabel);
</script>

</body>
</html>
